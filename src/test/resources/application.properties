spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

spring.datasource.url=jdbc:h2:mem:orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

bidmart.wallet.base-url=http://localhost:8083
bidmart.auth.base-url=http://localhost:8080
app.internal-service-token=bidmart-local-internal-token
bidmart.wallet.internal-token=bidmart-local-internal-token
bidmart.auth.internal-service-token=test-internal-service-token
bidmart.auth.jwt-secret=bidmart-order-test-jwt-secret-bidmart-order-test-jwt-secret

bidmart.rabbitmq.events-exchange=bidmart.events
bidmart.rabbitmq.order.auction-events-queue=order-notification.auction-events
bidmart.rabbitmq.auth-events-exchange=bidmart.auth.events
bidmart.rabbitmq.order.auth-events-queue=order-notification.auth-events

bidmart.order.payout-delay-minutes=5
bidmart.order.payout-scheduler-interval-ms=60000

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.rabbitmq.listener.simple.auto-startup=false
