spring.application.name=order-and-notification-service
spring.profiles.default=local
server.port=${PORT:8084}
spring.config.import=optional:file:.env[.properties],optional:file:../bidmart-infrastructure/.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

bidmart.rabbitmq.events-exchange=${BIDMART_EVENTS_EXCHANGE:bidmart.events}
bidmart.rabbitmq.order.auction-events-queue=${ORDER_AUCTION_EVENTS_QUEUE:order-notification.auction-events}

bidmart.wallet.base-url=${WALLET_SERVICE_URL:http://localhost:8083}
bidmart.wallet.internal-token=${GATEWAY_INTERNAL_TOKEN:local-dev-internal-token}
bidmart.auth.base-url=${AUTH_SERVICE_URL:http://localhost:8080}
bidmart.order.payout-delay-minutes=${ORDER_PAYOUT_DELAY_MINUTES:5}
bidmart.order.payout-scheduler-interval-ms=${ORDER_PAYOUT_SCHEDULER_INTERVAL_MS:60000}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
