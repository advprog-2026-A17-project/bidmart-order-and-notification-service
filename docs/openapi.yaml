openapi: 3.0.3
info:
  title: BidMart Order & Notification Service API
  version: 1.0.0
servers:
  - url: http://localhost:8000
tags:
  - name: orders
  - name: notifications
paths:
  /api/v1/orders:
    get:
      tags: [orders]
      summary: List orders for user
      parameters:
        - $ref: "#/components/parameters/XUserId"
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderResponse"
    post:
      tags: [orders]
      summary: Create order
      parameters:
        - $ref: "#/components/parameters/XUserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "403":
          description: Forbidden
  /api/v1/orders/{orderId}:
    get:
      tags: [orders]
      summary: Get order by ID
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "403":
          description: Forbidden
        "404":
          description: Not found
  /api/v1/orders/{orderId}/status:
    put:
      tags: [orders]
      summary: Update shipping status
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "403":
          description: Forbidden
  /api/v1/orders/{orderId}/confirm:
    post:
      tags: [orders]
      summary: Confirm receipt
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "403":
          description: Forbidden
  /api/v1/orders/events/auction-won:
    post:
      tags: [orders]
      summary: Create order from auction won event (internal)
      parameters:
        - $ref: "#/components/parameters/XInternalServiceToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuctionWonEventRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "200":
          description: Order already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "403":
          description: Invalid internal service token
  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: List notifications for user
      parameters:
        - $ref: "#/components/parameters/XUserId"
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"
  /api/v1/notifications/{notificationId}:
    get:
      tags: [notifications]
      summary: Get notification by ID
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "404":
          description: Not found
  /api/v1/notifications/{notificationId}/read-status:
    patch:
      tags: [notifications]
      summary: Update notification read status
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/NotificationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationReadStatusRequest"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
components:
  parameters:
    XUserId:
      in: header
      name: X-User-Id
      required: true
      schema:
        type: string
    XInternalServiceToken:
      in: header
      name: X-Internal-Service-Token
      required: true
      schema:
        type: string
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
    NotificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
  schemas:
    CreateOrderRequest:
      type: object
      properties:
        auctionId:
          type: string
        listingId:
          type: string
        sellerId:
          type: string
        buyerId:
          type: string
        finalPrice:
          type: number
          format: double
        shippingAddress:
          type: string
      required:
        [auctionId, listingId, sellerId, buyerId, finalPrice, shippingAddress]
    AuctionWonEventRequest:
      type: object
      properties:
        eventId:
          type: string
        auctionId:
          type: string
        listingId:
          type: string
        sellerId:
          type: string
        buyerId:
          type: string
        finalPrice:
          type: number
          format: double
        shippingAddress:
          type: string
      required:
        [eventId, auctionId, listingId, sellerId, buyerId, finalPrice, shippingAddress]
    UpdateOrderStatusRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        trackingNumber:
          type: string
          nullable: true
        carrier:
          type: string
          nullable: true
      required: [status]
    OrderResponse:
      type: object
      properties:
        id:
          type: string
        auctionId:
          type: string
        listingId:
          type: string
        sellerId:
          type: string
        buyerId:
          type: string
        finalPrice:
          type: number
          format: double
        shippingAddress:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
        shippingStatus:
          type: string
        trackingNumber:
          type: string
          nullable: true
        carrier:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, auctionId, listingId, sellerId, buyerId, finalPrice, shippingAddress, status, createdAt, updatedAt]
    OrderStatus:
      type: string
      enum: [CREATED, PACKED, SHIPPED, DELIVERED, CONFIRMED, DISPUTED]
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
        title:
          type: string
        message:
          type: string
        status:
          type: string
        read:
          type: boolean
        sourceEventId:
          type: string
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, userId, type, title, message, status, read, createdAt]
    UpdateNotificationReadStatusRequest:
      type: object
      properties:
        read:
          type: boolean
      required: [read]
